Description=Brass, iron and copper restyle of the whole interface: porthole minimap, compact HUD, DPS meter, chat colours, wishlist and more. Brass cursors too. Settings for it are in the game's Options, UI tab.
Changes=Summon gauge: shows how much room is left ("10 free"), each summon's HP in numbers, "Out of range" when a summon is too far, and a red pulse when a summon drops below 30% HP. Hover the gauge to see how many summons are out.
