Description=Brass, iron and copper restyle of the whole interface: porthole minimap, compact HUD, DPS meter, chat colours, wishlist and more. Brass cursors too. Settings for it are in the game's Options, UI tab.
Changes=All Steampunk art is drawn at double resolution, so it stays sharp at UI scaling up to 2x and better at 2.5x (26 unused pictures removed). New: a Max button in the crafting window (it counts your materials and MP, sets the amount and starts crafting).
