Group=UI Theme
Description=Brass, iron and copper restyle of the whole interface: porthole minimap, compact HUD, DPS meter, chat colours, wishlist and more. Brass cursors too. Settings for it are in the game's Options, UI tab.
Changes=Sort button in the inventory (next to the bag tabs) and in storage (next to Deposit/Withdraw): lays items out grouped by type with empty slots last. Items stay in their real slots - it changes the view only. Click Unsort, or change bag/tab/page, for the normal layout.
