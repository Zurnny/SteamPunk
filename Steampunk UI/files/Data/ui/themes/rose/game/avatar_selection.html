<rml>
    <head>
        <title>Avatar Selection</title>

        <link type="text/template" href="../templates/window-fixed.html" />
        <link type="text/rcss" href="../styles/sp_addons_steampunk_sprites.css" />
        <link type="text/rcss" href="../styles/sp_addons_steampunk.css" />

        <style>
            /* ==== Parts of the page for one look only (the other look's part stays hidden) ==== */
            #external-avatar-selection.sp-theme-default .sp-only-steampunk { display: none; }
            #external-avatar-selection.sp-theme-steampunk .sp-only-default { display: none; }

            /* ==== Both looks ==== */
            body { width: 100%; height: 100%; }
            #avatar-selection-window { width: 250dp; height: 80%; right: 20dp; margin: auto 0; display: flex; position: absolute; }
            button { width: 100%; }
            scrollbarvertical { width: 0; margin-top: 0; margin-bottom: 0; margin-right: 0; }
            #window-content { display: flex; flex-direction: column; justify-content: flex-start; align-items: center; }
            #avatar-list { display: block; width: 95%; overflow-y: auto; flex: 2; margin-right: 16dp; }
            #sort-container { display: flex; flex-direction: row; align-items: center; width: 95%; margin: 3dp 0; z-index: 3; }
            #sort-container select { flex: 1; width: auto; }
            #sort-container span { margin-right: 5dp; color: white; }
            #button-container { display: flex; flex-direction: column; align-items: center; width: 150dp; margin: 3dp 0; }
            .delete { font-effect: outline(1dp black); }
            .enter-btn { position: absolute; width: 200dp; bottom: 1%; left: 50%; margin-left: -100dp; }
            .avatar-item { width: 100%; height: 60dp; }
            .avatar-info { color: white; }

            /* ==== Default UI look only ==== */
            .sp-theme-default .avatar-name { font-size: 1.1em; font-weight: bold; color: yellow; }

            /* ==== Steampunk look only ==== */
            body.sp-theme-steampunk { width: 100%; height: 100%; }
            .sp-theme-steampunk #avatar-selection-window { width: 250dp; height: 80%; right: 20dp; margin: auto 0; display: flex; position: absolute; }
            .sp-theme-steampunk button { width: 100%; }
            .sp-theme-steampunk scrollbarvertical { width: 0; margin-top: 0; margin-bottom: 0; margin-right: 0; }
            .sp-theme-steampunk #window-content { display: flex; flex-direction: column; justify-content: flex-start; align-items: center; }
            .sp-theme-steampunk #avatar-list { display: block; width: 95%; overflow-y: auto; flex: 2; margin-right: 16dp; }
            .sp-theme-steampunk #sort-container { display: flex; flex-direction: row; align-items: center; width: 95%; margin: 3dp 0; z-index: 3; }
            .sp-theme-steampunk #sort-container select { flex: 1; width: auto; }
            .sp-theme-steampunk #sort-container span { margin-right: 5dp; color: white; }
            .sp-theme-steampunk #button-container { display: flex; flex-direction: column; align-items: center; width: 150dp; margin: 3dp 0; }
            .sp-theme-steampunk .delete { font-effect: outline(1dp black); }
            .sp-theme-steampunk .enter-btn { position: absolute; width: 200dp; bottom: 1%; left: 50%; margin-left: -100dp; }
            .sp-theme-steampunk .avatar-item { width: 100%; height: 60dp; }
            .sp-theme-steampunk .avatar-name { font-size: 1.1em; font-weight: bold; color: rgb(243, 211, 138); }
            .sp-theme-steampunk .avatar-info { color: white; }

        </style>
        <script>
-- Theme check (add-on windows work with the default UI and with the Steampunk
-- UI theme). Steampunk is installed when styles/steampunk.css exists; then this
-- window gets the class sp-theme-steampunk and uses the Steampunk look,
-- otherwise sp-theme-default and the game's own look. SP_THEME says which.
pcall(function()
    local sp = false
    pcall(function()
        local f = io.open('Data/ui/themes/rose/styles/steampunk.css', 'r')
        if f then f:close(); sp = true end
    end)
    SP_THEME = sp and 'steampunk' or 'default'
    local body = document:GetElementById('external-avatar-selection')
    if body then
        body:SetClass('sp-theme-default', not sp)
        body:SetClass('sp-theme-steampunk', sp)
    end
    -- (parts written for the other look stay in the window, hidden)
end)
        </script>
    </head>

    <body id="external-avatar-selection" onkeyup="navigate">
        <div id="avatar-selection-window" class="window-fixed-size">
            <handle class="window-title" style="cursor: default">Avatar Selection</handle>

            <div id="window-content" data-model="uiavtselection-data">
                <div id="sort-container">
                    <span>Sort:</span>
                    <select data-value="sort_order" data-event-change="sort_changed()">
                        <option value="0" selected>Last Login</option>
                        <option value="1">Name</option>
                        <option value="2">Level</option>
                        <option value="3">Job</option>
                    </select>
                </div>

                <button id="up" onclick="up" class="default" disabled>
                    <icon class="arrow-up"></icon>
                </button>

                <listbox id="avatar-list" button_up="up" button_down="down">
                    <listbox-item
                        data-for="avatar, avatar_index : avatars"
                        data-attr-id="avatar.name"
                        data-event-click="select_avatar(avatar_index)"
                        data-event-dblclick="enter_avatar(avatar_index)"
                        class="avatar-item"
                    >
                        <span class="avatar-name">{{avatar.name}}</span><br />
                        <span class="avatar-info">Level {{avatar.level}} {{avatar.job}}</span><br />
                        <span class="avatar-info" data-if="avatar.delete_time == 0">{{avatar.map}}</span>
                        <span data-if="avatar.delete_time > 0" class="delete">
                            <fc_orange><b>{{format_time(avatar.delete_time)}}</b></fc_orange>
                        </span>
                    </listbox-item>
                </listbox>

                <button id="down" onclick="down" class="default" disabled>
                    <icon class="arrow-down"></icon>
                </button>

                <div id="button-container">
                    <button class="default" onclick="create-avt">
                        <b>Create Character</b>
                    </button>
                    <button class="default" id="delete-avatar" onclick="delete-avt">
                        <b>Delete Character</b>
                    </button>
                    <button class="default" onclick="back"><b>Back</b></button>
                </div>
            </div>
        </div>

        <button id="enter-avatar" onclick="enter-avt" class="default enter-btn">
            <b>Enter World</b>
        </button>
    </body>
</rml>
