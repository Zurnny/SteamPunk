            option:disabled { color: gray; }

            gauge.red fill { background-color: #f00; animation: 0.5s cubic-in-out infinite alternate gauge-red; }

            button.amount { margin-top: -7dp; margin-right: -10dp; width: 30dp; height: 27dp; decorator: image(craftammount-button-n); }
            button.amount:disabled { cursor: normal; decorator: image(craftammount-button-d); }
            button[disabled] { cursor: normal; decorator: image(craftammount-button-d); }

            button.amount:not(button[disabled]):active { decorator: image(craftammount-button-a); }

            #game-crafting.sp-cmax-off button.sp-craft-max { display: none; }
            #sp-cmax-timer { position: absolute; width: 1dp; height: 1dp; opacity: 0; pointer-events: none; }
            #sp-switch-timer { position: absolute; width: 1dp; height: 1dp; opacity: 0; pointer-events: none; animation: 2s sp-switch-tick-a; }

            /* ==== Default UI look only ==== */
            .sp-theme-default label.custom { padding-top: 3dp; padding-bottom: 1dp; font-size: 12dp; font-effect: outline(1dp black); color: #ff0; }
            .sp-theme-default span.sub-title { font-weight: 800; color: rgb(252, 252, 193); }

            /* ==== Steampunk look only ==== */

            .sp-theme-steampunk span.sub-title { font-weight: 800; color: rgb(243, 211, 138); }
            .sp-theme-steampunk option:disabled { color: gray; }
            .sp-theme-steampunk item-slot { width: 40dp; height: 40dp; display: block; }
            .sp-theme-steampunk button[disabled] { cursor: normal; decorator: image(craftammount-button-d); }

            @keyframes gauge-red {
        from {
          background-color: red;
        }

        to {
          background-color: rgb(255, 145, 0);
        }
      }
            @keyframes sp-cmax-tick-a { from { opacity: 0; } to { opacity: 0; } }
            @keyframes sp-cmax-tick-b { from { opacity: 0; } to { opacity: 0; } }
            @keyframes sp-switch-tick-a { from { opacity: 0; } to { opacity: 0; } }
            @keyframes sp-switch-tick-b { from { opacity: 0; } to { opacity: 0; } }
        </style>
        <script>
-- Theme check (add-on windows work with the default UI and with the Steampunk
-- UI theme). Steampunk is installed when styles/steampunk.css exists; then this
-- window gets the class sp-theme-steampunk and uses the Steampunk look,
-- otherwise sp-theme-default and the game's own look. SP_THEME says which.
pcall(function()
    local sp = false
    pcall(function()
        local f = io.open('Data/ui/themes/rose/styles/steampunk.css', 'r')
        if f then f:close(); sp = true end
    end)
    SP_THEME = sp and 'steampunk' or 'default'
    local body = document:GetElementById('game-crafting')
    if body then
        body:SetClass('sp-theme-default', not sp)
        body:SetClass('sp-theme-steampunk', sp)
    end
    -- (parts written for the other look stay in the window, hidden)
end)
        </script>
    <script>
-- Max craft: the Max button next to the amount sets it to as many as you can
-- make and starts crafting. It reads what one craft needs from the material
-- slots (their number is the amount per craft) and counts what you have in
-- your bags (the inventory window holds every bag tab at once, so nothing has
-- to be opened or clicked), limits it by your MP when the recipe uses MP,
-- types it into the game's own amount box, presses OK and then Begin Crafting.
pcall(function()
    local document = document
    local function el(id) return document:GetElementById(id) end
    local function attr(e, k)
        if not e then return nil end
        local v = e:GetAttribute(k)
        if v == nil then return nil end
        return tostring(v)
    end
    local function num(s)
        s = tostring(s or ''):gsub('<[^>]*>', ''):gsub('[^%d]', '')
        return tonumber(s)
    end
    local function click(e)
        if not e then return false end
        if pcall(function() e:Click() end) then return true end
        return pcall(function() e:DispatchEvent('click', {}) end)
    end
    local function key(s) return (attr(s, 'item-type') or '?') .. ':' .. (attr(s, 'item-id') or '?') end

    -- the amount box and the crafting button need a moment after each click
    local steps, timer, flip = {}, el('sp-cmax-timer'), false
    local function later(fn) steps[#steps + 1] = fn end
    local function run_next()
        local fn = table.remove(steps, 1)
        if fn then
            if not pcall(fn) then steps = {} end
        end
        if #steps > 0 and timer then
            flip = not flip
            timer.style.animation = '0.15s ' .. (flip and 'sp-cmax-tick-b' or 'sp-cmax-tick-a')
        end
    end
    if timer then timer:AddEventListener('animationend', run_next) end

    local function start()
        steps = {}
        local ctx = document.context
        -- what one craft needs
        local need = {}
        for i = 1, 4 do
            local s = el('material-' .. i)
            if s and attr(s, 'empty') ~= 'true' then
                local k, n = key(s), num(attr(s, 'item-quantity')) or 1
                if not k:find('?', 1, true) and not k:find(':0$') and n > 0 then
                    need[#need + 1] = {key = k, n = n}
                end
            end
        end
        if #need == 0 then return end   -- no recipe picked
        -- what you have: every bag slot (all tabs are in the window at once)
        local inv = ctx and ctx.documents['inventory-window']
        if not inv then return end
        local have = {}
        for i = 0, 119 do
            local s = inv:GetElementById('bag-' .. i)
            if s and attr(s, 'empty') ~= 'true' then
                local k = key(s)
                have[k] = (have[k] or 0) + (num(attr(s, 'item-quantity')) or 1)
            end
        end
        local max = nil
        for _, m in ipairs(need) do
            local can = math.floor((have[m.key] or 0) / m.n)
            max = max and math.min(max, can) or can
        end
        -- MP: what one craft uses and what you have
        local mp_cost, mp_have = nil, nil
        pcall(function()
            local box = document:QuerySelector('.mp-container fc_blue')
            mp_cost = box and num(box.inner_rml)
        end)
        pcall(function()
            local g = ctx.documents['hud'] and ctx.documents['hud']:GetElementById('mana')
            mp_have = g and num(attr(g, 'gvalue'))
        end)
        if mp_cost and mp_cost > 0 and mp_have then max = math.min(max, math.floor(mp_have / mp_cost)) end
        if not max or max < 1 then return end
        local want = tostring(max)
        -- the game's amount box: type the number, OK, then Begin Crafting
        click(el('amount'))
        later(function()
            local box = ctx.documents['game-number-input']
            if not box then return end
            for _ = 1, 8 do click(box:GetElementById('del')) end
            for d in want:gmatch('%d') do click(box:GetElementById(d)) end
            later(function()
                click(box:GetElementById('ok'))
                later(function()
                    local go = el('sp-craft-start')
                    local off = go and go:HasAttribute('disabled')
                    if go and not off then click(go) end
                end)
            end)
        end)
        run_next()
    end
    local btn = el('sp-craft-max')
    if btn then btn:AddEventListener('click', function() pcall(start) end) end
end)
    </script>
    <script>
-- Add-on switches (the same script in every add-on window).
-- SP_ADDON_SWITCH craft_max
-- An add-on counts as installed while its marker file
-- Data/ui/sp_addons/<key>.txt exists. The launcher copies the marker in with
-- the add-on and takes it out again with it, so a window that several add-ons
-- share only runs the parts of the add-ons that are installed.
-- The on/off switches are in Options > UI > Add-ons and are saved in
-- sp_addons.txt (the Ice UI uses the same file; nobody removes anyone else's
-- lines). This window reads it every 2 seconds. Everything is on by default.
pcall(function()
    local BODY = 'game-crafting'
    -- key, class put on this window while that add-on is off or not installed ('' = none)
    local MINE = {{'craft_max', 'sp-cmax-off'}}
    local installed = {}
    SP_ADDON_INSTALLED = function(key)
        -- the Steampunk UI theme has every add-on built in
        if SP_THEME == 'steampunk' then return true end
        if installed[key] == nil then
            installed[key] = true      -- if the game won't let the UI read files, assume installed
            pcall(function()
                local f = io.open('Data/ui/sp_addons/' .. key .. '.txt', 'r')
                if f then f:close() else installed[key] = false end
            end)
        end
        return installed[key]
    end
    local flags = {}
    local function read_flags()
        flags = {}
        pcall(function()
            local f = io.open('sp_addons.txt', 'r')
            if not f then return end
            for line in f:lines() do
                local k, v = line:match('^%s*([%w_]+)%s*=%s*(%d)')
                if k then flags[k] = v end
            end
            f:close()
        end)
    end
    -- SP_ADDON_ON(key): installed and not switched off. Reads the switches fresh
    -- unless called with fresh == false.
    SP_ADDON_ON = function(key, fresh)
        if not SP_ADDON_INSTALLED(key) then return false end
        if fresh ~= false then read_flags() end
        return flags[key] ~= '0'
    end
    local doc = document
    local function apply()
        read_flags()
        for _, m in ipairs(MINE) do
            local on = SP_ADDON_ON(m[1], false)
            if m[2] ~= '' then pcall(function() (doc:GetElementById(BODY) or doc):SetClass(m[2], not on) end) end
            -- a script in this window can register SP_ADDON_HOOK['<key>@<body id>'] = function(on) ... end
            local hook = SP_ADDON_HOOK and SP_ADDON_HOOK[m[1] .. '@' .. BODY]
            if hook then pcall(hook, on) end
        end
    end
    apply()
    doc:AddEventListener('show', function() pcall(apply) end)
    doc:AddEventListener('mouseover', function() pcall(apply) end)
    -- repeating 2 second check: two identical animations swapped each time one ends
    pcall(function()
        local timer = doc:GetElementById('sp-switch-timer')   -- the empty div at the end of the body
        local flip = false
        timer:AddEventListener('animationend', function()
            pcall(apply)
            flip = not flip
            timer.style.animation = '2s ' .. (flip and 'sp-switch-tick-b' or 'sp-switch-tick-a')
        end)
    end)
end)
    </script>
  </head>

  <body id="game-crafting" class="window-fixed-size">
    <div data-model="crafting">
      <handle
        class="window-title"
        move_target="#document"
        id="window-title-text"
      ></handle>
      <button
        class="window-title-close"
        onclick="close"
        data-attrif-disabled="is_crafting"
      ></button>
    </div>

    <div id="window-content">
      <div class="main-container" data-model="crafting">
        <!-- Make Type -->
        <div class="risk-container">
          <span class="sub-title">
            <fc_gold>Type</fc_gold>
          </span>
          <select
            id="pat-make-type"
            data-if="make_type == 61"
            data-value="selected_make_class"
            onchange="set_make_class"
            data-attrif-disabled="is_crafting"
          >
            <option value="511" data-attrif-selected="selected_make_class == 511" data-attrif-disabled="skill_level &lt; 1">Cart Body</option>
            <option value="521" data-attrif-selected="selected_make_class == 521" data-attrif-disabled="skill_level &lt; 1">Cart Engine</option>
            <option value="531" data-attrif-selected="selected_make_class == 531" data-attrif-disabled="skill_level &lt; 1">Cart Wheels</option>
            <option value="571" data-attrif-selected="selected_make_class == 571" data-attrif-disabled="skill_level &lt; 2">Cart Weapons</option>
            <option value="551" data-attrif-selected="selected_make_class == 551" data-attrif-disabled="skill_level &lt; 2">Cart Accessories</option>
            <option value="581" data-attrif-selected="selected_make_class == 581" data-attrif-disabled="skill_level &lt; 1">Castle Gear Body</option>
            <option value="591" data-attrif-selected="selected_make_class == 591" data-attrif-disabled="skill_level &lt; 2">Castle Gear Engine</option>
            <option value="601" data-attrif-selected="selected_make_class == 601" data-attrif-disabled="skill_level &lt; 1">Castle Gear Leg</option>
            <option value="611" data-attrif-selected="selected_make_class == 611" data-attrif-disabled="skill_level &lt; 2">Castle Gear Weapons</option>
          </select>
          <select
            id="make-type"
            data-if="make_type != 61"
            data-value="selected_make_class"
            onchange="set_make_class"
            data-attrif-disabled="is_crafting"
          >
            <option
              data-for="make_class, index : class_list"
              data-value="make_class.id"
              data-attrif-selected="index == 0"
            >
              <span>{{make_class.name}}</span>
            </option>
          </select>
        </div>

        <div id="submain-container">
          <div class="main-container">
            <!-- Item List -->
            <div class="window-pane sub-container">
              <span class="sub-title"> </span>
              <listbox
                id="item-list"
                data-value="selected_item"
                onchange="select_item"
                data-attrif-disabled="is_crafting"
              >
                <listbox-item
                  class="inner-container"
                  data-for="item, item_index : item_list"
                  data-value="item_index"
                  data-if="item.id != 0"
                  data-attrif-disabled="is_crafting && selected_item != item_index"
                  data-selected_item="selected_item"
                >
                  <item-slot
                    data-attr-item-id="item.id"
                    data-attr-item-type="item.type"
                    item-quantity="1" hide-quantity data-attrif-item-actions="!preview"
                  />
                  <label class="textarea item-name"
                    ><span
                      class="item-name"
                      data-style-color="item.color"
                      style="width: 295dp"
                      >{{item.name}}</span
                    ></label
                  >
                </listbox-item>
              </listbox>
            </div>
          </div>

          <div class="main-container">
            <!-- Target Item -->
            <div class="window-pane sub-container">
              <span class="sub-title">
                <str string-id="1304" />
              </span>
              <div class="inner-container">
                <item-slot
                  id="target-item"
                  data-attr-item-id="make_item.id"
                  data-attr-item-type="make_item.type"
                  item-quantity="1" hide-quantity data-attrif-item-actions="!preview"
                  data-attr-item-durability="make_item.durability"
                />
                <label
                  class="textarea item-name"
                  data-style-color="make_item.color"
                  >{{make_item.name}}<str
                /></label>
              </div>
            </div>

            <!-- Materials -->
            <div class="window-pane sub-container">
              <span class="sub-title">
                <str string-id="1305" />
              </span>
              <div class="inner-container">
                <item-slot id="material-1" class="material"
                  ><span
                    data-if="material_list[0].quantity > 0 && material_list[0].id == 0 && !material_list[0].attached"
                    class="mat-quantity"
                    >{{material_list[0].quantity}}</span
                  ></item-slot
                >
                <div class="mat-prog">
                  <label
                    class="textarea item-name"
                    data-style-color="material_list[0].color"
                    >{{material_list[0].name}}</label
                  >
                  <gauge
                    id="gauge-1"
                    gvalue="0"
                    gmax="1000"
                    animation-duration="800"
                  >
                    <img
                      class="arrow"
                      sprite="up-arrow"
                      data-if="material_list[0].id != 0 || material_list[0].item_class != 0"
                      data-style-left="(287 * success_points[0] / 1000) + 'dp'"
                    />
                  </gauge>
                </div>
              </div>
              <div class="inner-container">
                <item-slot id="material-2" />
                <div class="mat-prog">
                  <label
                    class="textarea item-name"
                    data-style-color="material_list[1].color"
                    >{{material_list[1].name}}</label
                  >
                  <gauge
                    id="gauge-2"
                    gvalue="0"
                    gmax="1000"
                    animation-duration="800"
                  >
                    <img
                      class="arrow"
                      sprite="up-arrow"
                      data-if="material_list[1].id != 0"
                      data-style-left="(287 * success_points[1] / 1000) + 'dp'"
                    />
                  </gauge>
                </div>
              </div>
              <div class="inner-container">
                <item-slot id="material-3" />
                <div class="mat-prog">
                  <label
                    class="textarea item-name"
                    data-style-color="material_list[2].color"
                    >{{material_list[2].name}}</label
                  >
                  <gauge
                    id="gauge-3"
                    gvalue="0"
                    gmax="1000"
                    animation-duration="800"
                  >
                    <img
                      class="arrow"
                      sprite="up-arrow"
                      data-if="material_list[2].id != 0"
                      data-style-left="((287 * success_points[2]) / 1000) + 'dp'"
                    />
                  </gauge>
                </div>
              </div>
              <div class="inner-container">
                <item-slot id="material-4" />
                <div class="mat-prog">
                  <label
                    class="textarea item-name"
                    data-style-color="material_list[3].color"
                    >{{material_list[3].name}}</label
                  >
                  <gauge
                    id="gauge-4"
                    gvalue="0"
                    gmax="1000"
                    animation-duration="800"
                  >
                    <img
                      class="arrow"
                      sprite="up-arrow"
                      data-if="material_list[3].id != 0"
                      data-style-left="(287 * success_points[3] / 1000) + 'dp'"
                    />
                  </gauge>
                </div>
              </div>
              <div class="mp-container" data-if="consume_mp > 0">
                <span>MP</span>
                <label class="custom">
                  <fc_blue>{{ format_money(consume_mp) }}</fc_blue>
                </label>
              </div>
            </div>

            <!-- Crafting -->
            <div class="crafting-container">
              <div class="mp-container">
                <div class="mp-container">
                  <button id="sp-craft-max" class="default sp-craft-max" data-attrif-disabled="is_crafting">Max</button>
                  <button id="amount" class="amount" onclick="set-amount" />
                  <label class="custom amount">{{craft_amount}}</label>
                </div>
                <div class="mp-container">
                  <img id="suc-rate" sprite="percent-icon" />
                  <label class="custom">{{success_rate | format(2)}}%</label>
                </div>
              </div>

              <div class="tooltip" data-if="!is_crafting">
                <button
                  id="sp-craft-start"
                  class="default accept"
                  onclick="start"
                  data-attrif-disabled="!is_ready || is_crafting"
                >
                  <str string-id="894" />
                </button>
                <span
                  class="tooltiptext"
                  data-if="!is_ready && make_code > 0 && !is_crafting"
                >
                  <div class="warn-text" data-if="make_code == 1">
                    <img
                      id="suc-rate"
                      sprite="warning-red-icon"
                      width="16dp"
                      height="16dp"
                    />
                    <span><str string-id="17" /></span>
                  </div>
                  <div class="warn-text" data-if="make_code == 2">
                    <img
                      id="suc-rate"
                      sprite="warning-icon"
                      width="16dp"
                      height="16dp"
                    />
                    <span><str string-id="187" /></span>
                  </div>
                  <div class="warn-text" data-if="make_code == 3">
                    <img
                      id="suc-rate"
                      sprite="warning-icon"
                      width="16dp"
                      height="16dp"
                    />
                    <span><str string-id="127" /></span>
                  </div>
                  <div class="warn-text" data-if="make_code == 4">
                    <img
                      id="suc-rate"
                      sprite="warning-icon"
                      width="16dp"
                      height="16dp"
                    />
                    <span><str string-id="326" /></span>
                  </div>
                  <div class="warn-text" data-if="make_code == 5">
                    <img
                      id="suc-rate"
                      sprite="warning-icon"
                      width="16dp"
                      height="16dp"
                    />
                    <span><str string-id="325" /></span>
                  </div>
                </span>
              </div>

              <button
                class="default accept"
                data-if="is_crafting"
                onclick="cancel"
                data-attrif-disabled="craft_amount <= 0 || cancel_craft"
              >
                <str string-id="1353" />
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="sp-cmax-timer"></div>
    <div id="sp-switch-timer"></div>
  </body>
</rml>
