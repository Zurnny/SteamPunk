<rml>
    <head>
        <title>Skill Effects</title>
        <link type="text/rcss" href="../styles/html.css" />
        <link type="text/rcss" href="../styles/spritesheet_skillicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_elementicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_glassui.css" />
        <link type="text/rcss" href="../styles/scrollbar.css" />
        <link type="text/rcss" href="../styles/components.css" />
        <link type="text/rcss" href="../styles/sp_addons_steampunk_sprites.css" />
        <link type="text/rcss" href="../styles/sp_addons_steampunk.css" />
        <style>
            /* ==== Both looks ==== */
            #skill-hud-list { display: flex; flex-direction: row-reverse; flex-wrap: wrap; overflow-y: auto; max-height: 40vh; pointer-events: none; }
            #skill-hud-list scrollbarvertical { pointer-events: auto; }
            .hud-skill { position: relative; width: 40dp; min-width: 40dp; height: 60dp; flex-shrink: 0; pointer-events: auto; }
            .hud-skill-icon { display: block; width: 40dp; height: 40dp; pointer-events: none; }
            .hud-skill.dimmed .hud-skill-icon { image-color: rgb(128, 128, 128); }
            .hud-skill.invalid-clan:not(.dimmed) .hud-skill-icon { image-color: rgb(128, 128, 255); }
            .hud-skill-level { position: absolute; top: 22dp; right: 4dp; font-size: 12dp; font-weight: 820; pointer-events: none; }
            .hud-skill-timer { display: block; width: 40dp; height: 20dp; line-height: 20dp; text-align: center; font-size: 12dp; font-weight: 820; pointer-events: none; }
            .hud-skill-element { position: absolute; top: 0dp; left: 20dp; width: 18dp; height: 18dp; pointer-events: none; }
            .hud-skill.dimmed .hud-skill-element { image-color: rgb(128, 128, 128); }
            #skill-hud-tooltip { position: absolute; z-index: 100; clip: none; pointer-events: none; width: 260dp; max-width: 90vw; max-height: 90vh; }
            .skill-tooltip-name.invalid-clan { color: rgb(128, 128, 128); }
            .skill-tooltip-description { display: block; margin-bottom: 8dp; }
            .skill-tooltip-time { display: block; color: rgb(90, 230, 110); }
            .skill-tooltip-time.warning { color: rgb(255, 170, 60); }
            .skill-tooltip-time.danger { color: rgb(255, 80, 80); }
            #sp-buffpos-timer { position: absolute; width: 1dp; height: 1dp; opacity: 0; pointer-events: none; animation: 1s sp-buffpos-a; }
            #sp-dp-probe { position: absolute; width: 100dp; height: 1dp; visibility: hidden; pointer-events: none; }

            /* ==== Default UI look only ==== */
            #skill-hud.sp-theme-default { position: absolute; top: 10dp; right: 210dp; width: auto; max-width: 70vw; max-height: 40vh; pointer-events: none; font-effect: outline(1dp black), shadow(1dp 1dp black); }
            .sp-theme-default .skill-tooltip-name { display: block; color: yellow; margin-bottom: 8dp; }

            /* ==== Steampunk look only ==== */
            #skill-hud.sp-theme-steampunk { position: absolute; top: 10dp; right: 240dp; width: auto; max-width: 70vw; max-height: 40vh; pointer-events: none; font-effect: outline(1dp black), shadow(1dp 1dp black); }
            .sp-theme-steampunk .skill-tooltip-name { display: block; color: rgb(243, 211, 138); margin-bottom: 8dp; }

            @keyframes sp-buffpos-a { from { opacity: 0; } to { opacity: 0; } }
            @keyframes sp-buffpos-b { from { opacity: 0; } to { opacity: 0; } }
        </style>
        <script>
-- Theme check (add-on windows work with the default UI and with the Steampunk
-- UI theme). Steampunk is installed when styles/steampunk.css exists; then this
-- window gets the class sp-theme-steampunk and uses the Steampunk look,
-- otherwise sp-theme-default and the game's own look. SP_THEME says which.
pcall(function()
    local sp = false
    pcall(function()
        local f = io.open('Data/ui/themes/rose/styles/steampunk.css', 'r')
        if f then f:close(); sp = true end
    end)
    SP_THEME = sp and 'steampunk' or 'default'
    local body = document:GetElementById('skill-hud')
    if body then
        body:SetClass('sp-theme-default', not sp)
        body:SetClass('sp-theme-steampunk', sp)
    end
    -- (parts written for the other look stay in the window, hidden)
end)
        </script>
        <script>
-- The buff and proc icons sit just left of the minimap: once a second this
-- finds where the minimap really is (it changes with the UI scale, the screen
-- size and when the minimap is dragged) and lines the icons up 4dp from its
-- left edge. When the minimap is closed, or moved away from the top right,
-- the icons go back to 240dp from the right.
pcall(function()
    if SP_THEME == 'default' then return end
    local document = document
    local START = '240dp'
    local shown = nil
    local function set(v)
        if v ~= shown then document.style.right = v; shown = v end
    end
    local function place()
        local ctx = document.context
        local mm = ctx and ctx.documents['game-minimap']
        if not mm then set(START); return end
        local vis = true
        pcall(function() vis = mm:IsVisible() end)
        local w = mm.offset_width or 0
        if not vis or w <= 0 then set(START); return end
        local W = 0
        pcall(function() W = ctx.dimensions.x end)
        if not W or W <= 0 then
            local root = document.parent_node
            W = root and root.offset_width or 0
        end
        if W <= 0 then set(START); return end
        local probe = document:GetElementById('sp-dp-probe')
        local dp = probe and probe.offset_width > 0 and probe.offset_width / 100 or 1
        local left, top = mm.absolute_left or 0, mm.absolute_top or 0
        -- only while the minimap is at the top right, beside the icons
        if top > 60 * dp or left + w < W * 0.6 then set(START); return end
        set(string.format('%dpx', math.floor(W - left + 4 * dp + 0.5)))
    end
    local timer = document:GetElementById('sp-buffpos-timer')
    local flip = false
    if timer then
        timer:AddEventListener('animationend', function()
            pcall(place)
            flip = not flip
            timer.style.animation = '1s ' .. (flip and 'sp-buffpos-b' or 'sp-buffpos-a')
        end)
    end
    pcall(place)
end)
        </script>
    </head>
    <body id="skill-hud">
        <div id="skill-hud-root" data-model="skill-hud" data-style-width="strip_width + 'dp'" data-style-max-width="strip_max_width + 'dp'">
        <div id="skill-hud-list" class="ui-icon-strip">
            <div class="hud-skill" data-for="skill : entries" data-attr-id="'hud-skill-' + skill.slot" data-class-dimmed="skill.dimmed" data-class-invalid-clan="skill.invalid_clan" data-attr-onmouseover="'skill-tooltip:' + skill.slot + ':' + skill.skill_id" onmouseout="hide-tooltip">
                <img class="hud-skill-icon" data-attr-sprite="'skillicon-' + skill.icon" />
                <img class="hud-skill-element" data-if="skill.element > 0" data-attr-sprite="'elementicon-' + skill.element" />
                <span class="hud-skill-level" data-if="skill.level > 1">{{skill.level}}</span>
                <span class="hud-skill-timer">{{skill.timer}}</span>
            </div>
        </div>
        <div id="skill-hud-tooltip" class="ui-tooltip-surface" data-if="tooltip_visible" data-style-left="tooltip_x + 'px'" data-style-top="tooltip_y + 'px'">
            <div class="skill-tooltip-name" data-class-invalid-clan="tooltip_invalid_clan">{{tooltip_name}}</div>
            <div class="skill-tooltip-description" data-if="tooltip_description != ''">{{tooltip_description}}</div>
            <div class="skill-tooltip-time" data-if="tooltip_remaining != ''" data-class-warning="tooltip_time_class == 'warning'" data-class-danger="tooltip_time_class == 'danger'">{{tooltip_remaining}}</div>
        </div>
        </div>
        <div id="sp-buffpos-timer"></div>
        <div id="sp-dp-probe"></div>
    </body>
</rml>
